name: Daily job search

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST (03:30 UTC) every day
  workflow_dispatch:         # allows a manual "Run workflow" button

permissions:
  contents: write            # to commit sent_jobs.json back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search, update sheet, send email
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

      - name: Save list of already-emailed jobs
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sent_jobs.json
          git diff --cached --quiet || git commit -m "Update sent jobs $(date -u +%F)"
          git push
